name: build
on:
  push:
    tags: ["v*"]          # pushing a tag like v2.0 builds and publishes a release
  workflow_dispatch:      # manual runs only upload workflow artifacts

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            archive: MusicTools-windows-x64.zip
          # oldest supported runner, so the binary runs on older glibc distros too
          - os: ubuntu-22.04
            archive: MusicTools-linux-x64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
      - run: uv sync --locked --group build
      - run: uv run --group build python build.py

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/MusicTools -DestinationPath ${{ matrix.archive }}
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/MusicTools/assets
          cp assets/icon.png dist/MusicTools/assets/
          cp install-linux.sh dist/MusicTools/
          tar -C dist -czf ${{ matrix.archive }} MusicTools

      # The installers and packages contain the same build plus an "install-kind" file, which tells the in-app
      # updater how this copy updates (the .zip and .tar.gz have none: they are portable)
      - name: Installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF -like "refs/tags/v*") { $env:GITHUB_REF_NAME.TrimStart("v") } else { "0.0.${{ github.run_number }}" }
          Set-Content -Path dist/MusicTools/install-kind -Value "installer" -NoNewline
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc /Q "/DAppVersion=$version" packaging/windows/MusicTools.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Packages (Linux)
        if: runner.os == 'Linux'
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF" == refs/tags/v* ]] || version="0.0.${{ github.run_number }}"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/nfpm.tgz" \
            https://github.com/goreleaser/nfpm/releases/download/v2.48.0/nfpm_2.48.0_Linux_x86_64.tar.gz
          echo "6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750  $RUNNER_TEMP/nfpm.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/nfpm.tgz" -C "$RUNNER_TEMP" nfpm
          for p in rpm deb; do
            VERSION="$version" "$RUNNER_TEMP/nfpm" package -f packaging/linux/nfpm.yaml -p $p -t MusicTools-linux-x64.$p
          done

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.archive }}
          path: MusicTools-*

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      # The runner image ships the Android SDK (ANDROID_HOME); just add what the app builds against
      - name: Android SDK packages
        run: |
          sdkmanager="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
      # A static ffmpeg from GitHub instead of apt: the Ubuntu mirrors have hung this step for half an hour
      # (the tests fall back to ffmpeg for Opus, so opus-tools isn't needed)
      - name: ffmpeg
        timeout-minutes: 5
        run: |
          curl -fsSL --retry 3 --retry-all-errors --max-time 120 \
            https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz \
            | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/ffmpeg-master-latest-linux64-gpl/bin" >> "$GITHUB_PATH"
      - run: uv sync --locked --group build --group dev
      - name: Desktop tests
        run: uv run --group dev pytest -q tests
      - name: Phone app against the desktop server
        run: tests/android_interop.sh

      # The signing key lives only in repository secrets. Without them (e.g. a fork) the build
      # falls back to a debug APK, which installs fine but can't update a release install.
      - name: Build APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: musictools
        working-directory: android
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF" == refs/tags/v* ]] || version="0.0.${{ github.run_number }}-dev"
          args="-PversionName=$version"
          if [[ -n "$KEYSTORE_B64" ]]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
            ./gradlew --console=plain assembleRelease $args
            cp app/build/outputs/apk/release/app-release.apk ../MusicTools-android.apk
          else
            echo "::warning::No signing key in secrets; building a debug APK"
            ./gradlew --console=plain assembleDebug $args
            cp app/build/outputs/apk/debug/app-debug.apk ../MusicTools-android.apk
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: MusicTools-android.apk
          path: MusicTools-android.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # for the previous tag
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      # Title and notes from the CHANGELOG.md section of this version
      - id: notes
        run: |
          previous="$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)"
          echo "title=$(python3 packaging/release_notes.py "${GITHUB_REF_NAME#v}" "$previous" notes.md)" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.notes.outputs.title }}
          body_path: notes.md
          files: MusicTools-*
