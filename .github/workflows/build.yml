name: build
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install PySide6-Essentials mutagen numpy pyinstaller
      - run: python build.py
      - uses: actions/upload-artifact@v4
        with:
          name: MusicTools-${{ runner.os }}
          path: dist/
