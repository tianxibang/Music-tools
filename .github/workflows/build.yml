name: build
on:
  push:
    tags: ["v*"]          # pushing a tag like v2.0 builds and publishes a release
  workflow_dispatch:      # manual runs only upload workflow artifacts

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            archive: MusicTools-windows-x64.zip
          # oldest supported runner, so the binary runs on older glibc distros too
          - os: ubuntu-22.04
            archive: MusicTools-linux-x64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --locked --group build
      - run: uv run --group build python build.py

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/MusicTools -DestinationPath ${{ matrix.archive }}
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/MusicTools/assets
          cp assets/icon.png dist/MusicTools/assets/
          cp install-linux.sh dist/MusicTools/
          tar -C dist -czf ${{ matrix.archive }} MusicTools

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: MusicTools-*
          generate_release_notes: true
